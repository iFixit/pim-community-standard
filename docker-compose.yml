version: '3.7'

services:
  php:
    build: ./docker
    environment:
      APP_ENV: '${APP_ENV:-prod}'
      COMPOSER_HOME: '/var/www/.composer'
    volumes:
      - '/etc/dozuki:/etc/dozuki:ro'
      - './:/srv/pim'
      - '${HOST_COMPOSER_HOME:-./data/composer}:/var/www/.composer'
    working_dir: '/srv/pim'
    command: 'php'
    init: true
    networks:
      - 'pim'

  fpm:
    build: ./docker
    environment:
      APP_ENV: '${APP_ENV:-prod}'
    volumes:
      - '/etc/dozuki:/etc/dozuki:ro'
      - './:/srv/pim'
    working_dir: '/srv/pim'
    command: 'php-fpm -F'
    restart: always
    networks:
      - 'pim'

  node:
    image: 'akeneo/node:14'
    environment:
      YARN_CACHE_FOLDER: '/home/node/.yarn'
    volumes:
      - './:/srv/pim'
      - '${HOST_YARN_CACHE_FOLDER:-./data/yarn}:/home/node/.yarn'
    working_dir: '/srv/pim'
    networks:
      - 'pim'

  httpd:
    image: 'httpd:2.4'
    environment:
      APP_ENV: '${APP_ENV:-prod}'
    depends_on:
      - 'fpm'
    ports:
      - '${DOCKER_PORT_HTTP:-8080}:80'
    volumes:
      - './:/srv/pim:ro'
      - './docker/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro'
      - './docker/akeneo.conf:/usr/local/apache2/conf/vhost.conf:ro'
    restart: always
    privileged: true
    networks:
      - 'pim'

  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:7.16.2'
    environment:
      ES_JAVA_OPTS: '${ES_JAVA_OPTS:--Xms512m -Xmx512m}'
      discovery.type: 'single-node'
    ports:
      - '${DOCKER_PORT_ELASTICSEARCH:-9210}:9200'
    volumes:
      - './data/elasticsearch:/usr/share/elasticsearch/data'
    restart: always
    networks:
      - 'pim'

  job-consumer:
    build: ./docker
    environment:
      APP_ENV: '${APP_ENV:-prod}'
    depends_on:
      - 'fpm'
    volumes:
      - '/etc/dozuki:/etc/dozuki:ro'
      - './:/srv/pim'
    working_dir: '/srv/pim'
    command: 'php bin/console messenger:consume ui_job import_export_job data_maintenance_job --env=$APP_ENV'
    restart: always
    networks:
      - 'pim'

networks:
  pim:
