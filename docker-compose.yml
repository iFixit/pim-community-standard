services:
  php:
    image: 'akeneo/pim-php-dev@sha256:772f7547a65eacb39aba59a53b4012b172f02a11f05cf697bbb64bbce05c1032'
    environment:
      APP_ENV: '${APP_ENV:-prod}'
      COMPOSER_HOME: '/var/www/.composer'
    volumes:
      - '/etc/dozuki:/etc/dozuki:ro'
      - './:/srv/pim'
      - '${HOST_COMPOSER_HOME:-./data/composer}:/var/www/.composer'
    working_dir: '/srv/pim'
    command: 'php'
    user: 'www-data'
    init: true
    networks:
      - 'pim'

  fpm:
    image: 'akeneo/pim-php-dev@sha256:772f7547a65eacb39aba59a53b4012b172f02a11f05cf697bbb64bbce05c1032'
    environment:
      APP_ENV: '${APP_ENV:-prod}'
    volumes:
      - '/etc/dozuki:/etc/dozuki:ro'
      - './:/srv/pim'
    working_dir: '/srv/pim'
    command: 'php-fpm -F'
    restart: always
    networks:
      - 'pim'

  node:
    image: 'akeneo/node:18'
    environment:
      YARN_CACHE_FOLDER: '/home/node/.yarn'
      CYPRESS_CACHE_FOLDER: '/home/node/.cypress'
    volumes:
      - './:/srv/pim'
      - '${HOST_YARN_CACHE_FOLDER:-./data/yarn}:/home/node/.yarn'
    working_dir: '/srv/pim'
    networks:
      - 'pim'

  httpd:
    image: 'httpd:2.4'
    environment:
      APP_ENV: '${APP_ENV:-prod}'
    depends_on:
      - 'fpm'
    ports:
      - '${DOCKER_PORT_HTTP:-8080}:80'
    volumes:
      - './:/srv/pim:ro'
      - './docker/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro'
      - './docker/akeneo.conf:/usr/local/apache2/conf/vhost.conf:ro'
    restart: always
    privileged: true
    networks:
      - 'pim'

  elasticsearch:
    image: 'elastic/elasticsearch:8.4.2'
    environment:
      ES_JAVA_OPTS: '${ES_JAVA_OPTS:--Xms1g -Xmx1g}'
      discovery.type: 'single-node'
      xpack.security.enabled: 'false'
      indices.id_field_data.enabled: 'true'
    ports:
      - '${DOCKER_PORT_ELASTICSEARCH:-9210}:9200'
    volumes:
      - './data/elasticsearch:/usr/share/elasticsearch/data'
    restart: always
    networks:
      - 'pim'

  job-consumer:
    image: 'akeneo/pim-php-dev@sha256:772f7547a65eacb39aba59a53b4012b172f02a11f05cf697bbb64bbce05c1032'
    user: 1000:1000
    environment:
      APP_ENV: '${APP_ENV:-prod}'
    depends_on:
      - 'fpm'
    volumes:
      - '/etc/dozuki:/etc/dozuki:ro'
      - './:/srv/pim'
    working_dir: '/srv/pim'
    command: 'php bin/console messenger:consume ui_job import_export_job data_maintenance_job --env=$APP_ENV'
    restart: always
    networks:
      - 'pim'

networks:
  pim:
